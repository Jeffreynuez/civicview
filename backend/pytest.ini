# The files in tests/ named test_*.py are standalone scripts: each one
# sets up its own throwaway database through environment variables
# before importing the app, and several run their checks at import
# time. Importing them all into one pytest process would make them
# share one app and one database, so pytest must not collect them
# directly. Instead it collects tests/script_suite.py, which runs every
# script in its own Python process and fails if the script exits
# non-zero.
#
# Run everything:        cd backend && python -m pytest
# Run one script:        cd backend && python -m pytest -k test_ballot_guard
# Or run a script alone: cd backend && python tests/test_ballot_guard.py
[pytest]
testpaths = tests
python_files = script_suite.py
addopts = -q
