# CivicView — Render deployment blueprint.
# Copyright (c) 2026 Jeffrey De La Nuez. All rights reserved.
#
# Render auto-creates the resources defined here when you "New +" →
# "Blueprint" and point it at this repo. Two pieces:
#
#   1. civicview-api   — FastAPI backend (Python, Standard $25/mo —
#                        always-on, 2GB RAM, 1 CPU)
#   2. civicview-db    (Postgres) The live database is on a PAID plan
#                        (basic_1gb, PostgreSQL 18, 5 GB disk, checked
#                        2026-09-25). This file deliberately sets no
#                        plan for it: Render keeps an existing
#                        database's plan when the field is omitted, and
#                        the old `plan: free` line here could have
#                        downgraded it if the Blueprint were ever synced.
#
# After first deploy:
#   • DATABASE_URL is auto-injected into civicview-api from the DB.
#   • Set SESSION_SECRET in the dashboard (do NOT commit it). 32+
#     bytes of randomness — `python -c "import secrets;
#     print(secrets.token_urlsafe(48))"` in your terminal.
#   • Set ALLOWED_ORIGINS to the Vercel URL (e.g.
#     "https://civicview.app,https://www.civicview.app").
#   • Set GOOGLE_CIVIC_API_KEY if/when you wire BallotTab live data.
#
# Plan note: Standard ($25/mo) is the published prod plan. NEVER set
# this to `free`: if this file is synced as a Blueprint, the sync
# drags the live dashboard's plan back to whatever's here, which means
# a free-tier downgrade would silently revert any manual upgrade and put
# api.civicview.app back to "spins down after 15min, ~30s cold
# starts." If you genuinely need to downgrade, change this AND
# confirm in the dashboard on the next sync.

services:
  - type: web
    name: civicview-api
    env: python
    region: oregon            # closest US region to Vercel default
    plan: standard            # $25/mo — 2GB RAM, 1 CPU, always-on.
                              # DO NOT change to `free` without coordination
                              # (see the Plan note at the top of this file).
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    # /healthz answers 200 only when the database does (audit O2); the
    # old path, /, returns static JSON even with the database down. This
    # stays on / until the release that adds /healthz is live: if this
    # file is ever synced as a Blueprint, switching the path in the same
    # release could point Render at /healthz while the old version, which
    # 404s on it, is still serving. Set /healthz in the dashboard after
    # that deploy, then change this line to match.
    healthCheckPath: /
    envVars:
      # Python version for the build. Keep in step with .python-version
      # at the repo root, which CI reads. Render needs the full x.y.z.
      - key: PYTHON_VERSION
        value: "3.14.3"
      - key: DATABASE_URL
        fromDatabase:
          name: civicview-db
          property: connectionString
      - key: SESSION_SECRET
        sync: false           # set in the Render dashboard (secret)
      - key: ALLOWED_ORIGINS
        sync: false           # set after first Vercel deploy
      - key: COOKIE_SECURE
        value: "true"         # production HTTPS — required for SameSite=None
      - key: COOKIE_SAMESITE
        value: "none"         # cross-origin cookie (frontend on Vercel)
      - key: GOOGLE_CIVIC_API_KEY
        sync: false           # optional — leave unset until BallotTab live data is needed
      # AI features (comment classification, post summaries, etc.)
      # are powered by Anthropic's Claude Haiku 4.5. The backend boots
      # fine without this key — AI surfaces just degrade to a
      # "Coming soon" state until the key is set. Get a key from
      # https://console.anthropic.com → API Keys.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional per-day token caps in app/services/ai_service.py.
      # Set both to 0 in dev if you want to disable the safeguard.
      # Defaults are 60M input / 15M output tokens per day (roughly
      # $135 worst-case at Haiku rates).
      - key: AI_DAILY_INPUT_TOKEN_CAP
        sync: false
      - key: AI_DAILY_OUTPUT_TOKEN_CAP
        sync: false
      # Auto-hide threshold for content reports. Defaults to 5; set
      # to 0 to disable. Reports still accumulate either way.
      - key: REPORT_AUTO_HIDE_THRESHOLD
        sync: false
      # Comma-separated list of email addresses with admin powers
      # (access to /api/admin/* + the /admin page). Any rep or
      # citizen account whose email matches gets in. Citizen admins
      # also need verified=True on their account — see
      # DEMO_CITIZEN_ACCOUNTS_JSON below for the seed path. Leaving
      # ADMIN_EMAILS unset means NOBODY is admin — every admin
      # endpoint 403s.
      - key: ADMIN_EMAILS
        sync: false
      # JSON blob seeding citizen accounts at boot. Same shape as
      # backend/demo_citizen_accounts.json. Use this to seed your own
      # admin login without waiting for ID.me — set "verified": true
      # on the entry to mark it non-demo, then add the same email to
      # ADMIN_EMAILS. Idempotent on email.
      - key: DEMO_CITIZEN_ACCOUNTS_JSON
        sync: false
      # Notifications — when a report comes in, email every ADMIN_EMAILS
      # recipient. Powered by Resend (resend.com); set RESEND_API_KEY to
      # enable. NOTIFICATION_FROM_EMAIL must be on a Resend-verified
      # domain (or use onboarding@resend.dev for unverified testing).
      # PUBLIC_APP_URL is spliced into the email's "open the queue" link.
      # REPORT_NOTIFICATIONS_ENABLED is a kill-switch that doesn't
      # require rotating the API key.
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_FROM_EMAIL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: REPORT_NOTIFICATIONS_ENABLED
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"            # flush logs immediately so Render shows them in real time

      # Everything below is read by the code but was missing from this
      # file until 2026-09-25 (audit O3). All are secrets or per-deploy
      # choices, so none carries a value here: set them in the Render
      # dashboard. In production the app logs an ERROR at every boot for
      # each missing one that turns a feature off (see
      # RECOMMENDED_SETTINGS in backend/app/services/runtime_env.py).

      # Live data sources.
      - key: CONGRESS_API_KEY
        sync: false
      - key: OPENSTATES_API_KEY
        sync: false
      - key: OPEN_FEC_API_KEY
        sync: false
      - key: COURTLISTENER_TOKEN
        sync: false
      # Post images on Cloudflare R2. Without all four, images go to the
      # server's temporary disk and are lost on the next deploy.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false           # optional; without it images use presigned URLs
      # Transactional email (password resets, account emails).
      - key: POSTMARK_API_TOKEN
        sync: false
      - key: POSTMARK_FROM_EMAIL
        sync: false
      - key: POSTMARK_MESSAGE_STREAM
        sync: false           # optional, defaults to "outbound"
      - key: PASSWORD_RESET_URL_BASE
        sync: false           # optional, defaults to https://civicview.app
      # Waitlist mirror to Brevo.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_WAITLIST_LIST_ID
        sync: false
      - key: BREVO_DOI_TEMPLATE_ID
        sync: false           # optional; turns on double opt-in
      - key: BREVO_DOI_REDIRECT_URL
        sync: false           # optional; used with the DOI template
      # Push notifications (FCM).
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # Feature switches. Unset means off.
      - key: FORCE_2FA_ENABLED
        sync: false
      - key: DIGEST_ENABLED
        sync: false
      - key: IDME_ENABLED
        sync: false
      - key: ENABLE_API_DOCS
        sync: false           # leave unset in production
      - key: DEMO_SUNSET_AT
        sync: false
      - key: APP_MIN_VERSION_CODE
        sync: false           # native force-update gate; 0 or unset = inert
      - key: APP_LATEST_VERSION_CODE
        sync: false
      # Emergency only: lets production start even though a startup
      # schema change failed (see init_db in backend/app/db.py). Unset
      # it as soon as the schema is repaired.
      - key: CIVICVIEW_ALLOW_SCHEMA_DRIFT
        sync: false
      # Tuning.
      - key: AI_MODERATION_RESERVE_FRACTION
        sync: false
      - key: LOGIN_ATTEMPT_RETENTION_DAYS
        sync: false
      # Seeding and one-off maintenance.
      - key: DEMO_ACCOUNTS_JSON
        sync: false
      - key: DEMO_CANDIDATE_ACCOUNTS_JSON
        sync: false
      - key: CIVICVIEW_WIPE_REP_DEMO
        sync: false           # one-shot wipe; unset it after the boot that uses it
      # Billing (Stripe) and identity verification (ID.me). Unset until
      # those features launch.
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: IDME_CLIENT_ID
        sync: false
      - key: IDME_CLIENT_SECRET
        sync: false
      - key: IDME_REDIRECT_URI
        sync: false
      - key: IDME_POST_AUTH_REDIRECT
        sync: false
      - key: IDME_SCOPES
        sync: false
      - key: IDME_AUTHORIZE_URL
        sync: false
      - key: IDME_TOKEN_URL
        sync: false
      - key: IDME_USERINFO_URL
        sync: false

databases:
  - name: civicview-db
    # No plan on purpose; see the note at the top of this file.
    region: oregon
    databaseName: civicview
